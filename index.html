<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>IMJ Contrôle</title>
<link rel="manifest" href="manifest-controle.json">
<meta name="theme-color" content="#002A7D">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #F6F9FB;
    color: #212529;
    display: flex;
    flex-direction: column;
  }
  header { background: #002A7D; color: white; padding: 12px 16px 0; flex: none; }
  header h1 { font-size: 18px; font-weight: 600; }
  nav { display: flex; gap: 6px; margin-top: 10px; max-width: 480px; }
  nav button {
    flex: 1;
    padding: 11px 8px;
    border: none;
    border-radius: 8px 8px 0 0;
    background: rgba(255, 255, 255, 0.15);
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  nav button.actif { background: #F6F9FB; color: #002A7D; }
  #pages { flex: 1; position: relative; min-height: 0; }
  #pages iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #F6F9FB; }
  #pages iframe.actif { display: block; }
</style>
</head>
<body>

<header>
  <h1>IMJ Contrôle</h1>
  <nav>
    <button id="onglet-reprise" onclick="ouvrirOnglet('reprise')">Reprise des carnets</button>
    <button id="onglet-controle" onclick="ouvrirOnglet('controle')">Contrôle terrain</button>
  </nav>
</header>
<div id="pages"></div>

<script>
// IMJ Controle : une seule appli, deux onglets.
// - Reprise des carnets (reprise.html) : les carnets d'avant le logiciel, saisis puis envoyes au bureau.
// - Controle terrain (controle.html) : le controleur compare les carnets papier a la liste du logiciel.
// Chaque onglet garde sa connexion et ses donnees dans le telephone, dans les memes bases
// qu'avant (imj_reprise_terrain, imj_controle_terrain) : ce qui attendait d'etre envoye est toujours la.
const PAGES = {
  reprise: { fichier: "reprise.html", titre: "Reprise des carnets" },
  controle: { fichier: "controle.html", titre: "Contrôle terrain" },
};
const CLE_ONGLET = "imj-controle-onglet";

function ouvrirOnglet(nom) {
  if (!PAGES[nom]) nom = "reprise";
  for (const autre of Object.keys(PAGES)) {
    document.getElementById(`onglet-${autre}`).classList.toggle("actif", autre === nom);
    const cadre = document.getElementById(`page-${autre}`);
    if (cadre) cadre.classList.toggle("actif", autre === nom);
  }
  // Une page n'est chargee qu'a sa premiere ouverture, puis gardee :
  // passer d'un onglet a l'autre ne perd pas une saisie commencee.
  if (!document.getElementById(`page-${nom}`)) {
    const cadre = document.createElement("iframe");
    cadre.id = `page-${nom}`;
    cadre.src = PAGES[nom].fichier;
    cadre.title = PAGES[nom].titre;
    cadre.className = "actif";
    document.getElementById("pages").appendChild(cadre);
  }
  history.replaceState(null, "", `#${nom}`);
  try { localStorage.setItem(CLE_ONGLET, nom); } catch (e) {}
}

window.addEventListener("hashchange", () => ouvrirOnglet(location.hash.slice(1)));

let ongletDeDepart = location.hash.slice(1);
if (!PAGES[ongletDeDepart]) {
  try { ongletDeDepart = localStorage.getItem(CLE_ONGLET); } catch (e) { ongletDeDepart = null; }
}
ouvrirOnglet(ongletDeDepart);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
